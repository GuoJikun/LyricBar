<!DOCTYPE html>
<html><head><style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
body { display:flex; justify-content:center; align-items:center; }
.text { font-family:"Microsoft YaHei",sans-serif; font-size:14px; font-weight:bold;
         color:white; text-shadow:0 1px 3px rgba(0,0,0,0.8); white-space:nowrap;
         overflow:hidden; text-overflow:ellipsis; max-width:100%; }
</style></head><body>
<div id="lyric" class="text"></div>
<script>
(async function() {
  const el = document.getElementById('lyric');
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  await invoke('embed_lyric_window');

  listen('lyric-update', (event) => {
    el.textContent = event.payload;
  });
})();
</script>
</body></html>
